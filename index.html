<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>I2School — Espace Anglais</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--bg:#f4f7f5;--card:#fff;--tx:#15201a;--mu:#68766e;--ac:#087a4b;--ac2:#0d5f8c;--yl:#e8b923;--bd:#dce5df;--er:#b3261e;--sh:0 8px 28px #173b2b10}
*{box-sizing:border-box}body{margin:0;font:15px system-ui,-apple-system,Segoe UI,sans-serif;background:var(--bg);color:var(--tx)}
button,input,select,textarea{font:inherit;border:1px solid var(--bd);border-radius:9px;background:var(--card);color:var(--tx);padding:9px 11px}button{cursor:pointer}button.p{background:var(--ac);border-color:var(--ac);color:#fff}button.b{background:var(--ac2);border-color:var(--ac2);color:#fff}button.d{color:var(--er)}button:disabled{opacity:.5;cursor:not-allowed}
header{position:sticky;top:0;z-index:8;background:var(--card);border-bottom:1px solid var(--bd);padding:10px 18px;display:flex;align-items:center;gap:14px;justify-content:space-between}.brand{font-weight:800}.brand small{display:block;color:var(--mu);font-weight:500;font-size:11px}
nav{display:flex;gap:5px;flex-wrap:wrap}nav button{border:0;background:transparent}nav button.on{background:var(--ac);color:#fff}
main{max-width:1180px;margin:auto;padding:20px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:16px;box-shadow:var(--sh);margin-bottom:14px}.hero{background:linear-gradient(135deg,#087a4b,#0d5f8c);color:#fff}.hero .mu{color:#e8f3ee}.k{font-size:28px;font-weight:800;color:var(--ac)}.mu{color:var(--mu);font-size:13px}.tag{display:inline-block;padding:3px 8px;border-radius:99px;background:#eef4f0;border:1px solid var(--bd);font-size:12px}.bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px}.two{display:grid;grid-template-columns:1fr 1fr;gap:14px}.sc{overflow:auto}table{border-collapse:collapse;width:100%}th,td{padding:9px;border-bottom:1px solid var(--bd);text-align:left;vertical-align:middle}th{font-size:12px;color:var(--mu)}tr.click{cursor:pointer}tr.click:hover{background:#f3f7f4}.empty{padding:24px;text-align:center;color:var(--mu)}textarea{width:100%;min-height:110px;resize:vertical}.field{display:grid;gap:5px;margin-bottom:10px}.field label{font-size:12px;color:var(--mu);font-weight:650}.modal{position:fixed;inset:0;background:#10201966;display:none;align-items:center;justify-content:center;z-index:20;padding:18px}.modal.show{display:flex}.modal>div{max-width:680px;width:100%;max-height:90vh;overflow:auto}.close{float:right}.msg{padding:12px;border:1px solid var(--bd);border-radius:10px;margin:8px 0}.msg.unread{border-left:4px solid var(--ac);background:#f3faf6}.msg .meta{font-size:12px;color:var(--mu)}#toastRoot{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#173a2a;color:white;padding:11px 17px;border-radius:10px;z-index:30;box-shadow:var(--sh)}#toast.bad{background:var(--er)}.lg{max-width:390px;margin:13vh auto}.loginwrap{min-height:100vh;display:grid;place-items:center;padding:18px}.loginwrap .card{width:100%}.accent{color:var(--ac)}@media(max-width:760px){.two{grid-template-columns:1fr}header{position:static}.brand{min-width:100%}main{padding:12px}}@media print{header,.np,#toastRoot{display:none!important}.card{box-shadow:none}}
</style>
</head>
<body><div id="app"></div><div id="toastRoot" hidden></div><div id="modalRoot" class="modal"><div class="card" id="modalBody"></div></div>
<script>
const sb=supabase.createClient('https://bkuhcxgmxrbjydkuklgo.supabase.co','sb_publishable_rjpYK53ugeDJrVoRo2B6mQ_5raQHAVU');
const app=document.getElementById('app'),toastEl=document.getElementById('toastRoot'),M={};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money=n=>n==null?'—':Number(n).toFixed(2),ST={draft:'Brouillon',validated:'Validé',published:'Publié',locked:'Verrouillé'};
function toast(x,bad=false){toastEl.textContent=x;toastEl.className=bad?'bad':'';toastEl.hidden=false;setTimeout(()=>toastEl.hidden=true,3500)}
function closeModal(){document.getElementById('modalRoot').classList.remove('show')}
function modal(html){document.getElementById('modalBody').innerHTML=html;document.getElementById('modalRoot').classList.add('show')}
const opts=(a,v,l,sel)=>a.map(x=>'<option value="'+esc(x[v])+'"'+(x[v]==sel?' selected':'')+'>'+esc(l(x))+'</option>').join('');

function authInviteState(){
 const hash=new URLSearchParams(location.hash.replace(/^#/,''));
 const type=hash.get('type');
 const hasAccessToken=hash.has('access_token');
 const error=hash.get('error');
 const errorCode=hash.get('error_code');
 const description=hash.get('error_description');
 if(error||errorCode)return {error, errorCode, description:description?decodeURIComponent(description):''};
 return {type,hasAccessToken};
}
async function invitationSetup(){
 const s=authInviteState();
 if(s.type==='recovery'){
  const {data:{session},error}=await sb.auth.getSession();
  if(error||!session){app.innerHTML='<div class="loginwrap"><div class="card lg"><h2>Réinitialisation du mot de passe</h2><p class="mu">Le lien de réinitialisation n’est plus valide. Demandez un nouveau lien depuis la page de connexion.</p></div></div>';return true;}
  passwordForm('reset');return true;
 }
 if(s.error||s.errorCode){
  app.innerHTML='<div class="loginwrap"><div class="card lg"><div class="hero card" style="margin:-16px -16px 16px;border:0"><h1 style="margin:0">I2School</h1><div class="mu">Activation du compte</div></div><h2>Lien d’invitation invalide ou expiré</h2><p class="mu">'+esc(s.description||'Le lien utilisé n’est plus valide.')+'</p><p class="mu">Demandez à l’administration de vous envoyer une nouvelle invitation.</p><button class="p" style="width:100%" onclick="location.hash=&quot;&quot;;location.reload()">Retour à la connexion</button></div></div>';
  return true;
 }
 if(s.type!=='invite' && !(s.hasAccessToken && s.type!=='recovery'))return false;
 const {data:{session},error}=await sb.auth.getSession();
 if(error||!session){
  app.innerHTML='<div class="loginwrap"><div class="card lg"><h2>Activation du compte</h2><p class="mu">La session d’invitation n’est pas disponible. Ouvrez le lien reçu dans votre e-mail.</p></div></div>';
  return true;
 }
 app.innerHTML='<div class="loginwrap"><div class="card lg"><div class="hero card" style="margin:-16px -16px 16px;border:0"><h1 style="margin:0">I2School</h1><div class="mu">Activation de votre compte</div></div><h2>Créez votre mot de passe</h2><p class="mu">Choisissez le mot de passe qui vous servira à vous connecter à I2School.</p><div class="field"><label>Mot de passe *</label><input id="invitePw" type="password" autocomplete="new-password" minlength="8"></div><div class="field"><label>Confirmer le mot de passe *</label><input id="invitePw2" type="password" autocomplete="new-password" minlength="8"></div><button class="p" id="activateBtn" style="width:100%">Activer mon compte</button><p id="inviteMsg" class="mu" style="margin-top:10px"></p></div></div>';
 const activate=async()=>{
  const p=invitePw.value,p2=invitePw2.value;
  if(p.length<8)return toast('Le mot de passe doit contenir au moins 8 caractères.',true);
  if(p!==p2)return toast('Les deux mots de passe ne correspondent pas.',true);
  activateBtn.disabled=true;
  const {error}=await sb.auth.updateUser({password:p});
  activateBtn.disabled=false;
  if(error){toast(error.message||'Activation impossible',true);return}
  history.replaceState({},document.title,location.pathname+location.search);
  toast('Compte activé. Bienvenue sur I2School.');
  setTimeout(()=>boot(),400);
 };
 activateBtn.onclick=activate;
 invitePw2.onkeydown=e=>{if(e.key==='Enter')activate()};
 return true;
}
async function boot(){
 if(await invitationSetup())return;
 const {data:{session}}=await sb.auth.getSession();if(!session)return login();
 const {data:me,error}=await sb.from('profiles').select('*').eq('auth_user_id',session.user.id).maybeSingle();
 if(error||!me){app.innerHTML='<main><div class="card">Profil introuvable pour ce compte.</div></main>';return}
 M.me=me;M.staff=['admin','school_life'].includes(me.role);
 M.teacher=(await sb.from('teachers').select('id,profile_id').eq('profile_id',me.id).maybeSingle()).data;
 M.student=(await sb.from('students').select('id,first_name,last_name,student_number').eq('profile_id',me.id).maybeSingle()).data;
 M.parent=(await sb.from('parents').select('id').eq('profile_id',me.id).maybeSingle()).data;
 const [ty,cl,en]=await Promise.all([
  sb.from('terms').select('id,name,term_number,status').order('term_number'),
  sb.from('classes').select('id,name,code,academic_year_id,level_id,levels(name,sort_order)').order('name'),
  sb.from('subjects').select('id,name,is_enabled').eq('name','Anglais').maybeSingle()
 ]);
 M.terms=ty.data||[];M.classes=cl.data||[];M.english=en.data;M.term=(M.terms.find(x=>x.status==='active')||M.terms[0])?.id;
 if(M.student||M.parent)return learnerShell();
 if(!M.staff&&!M.teacher){app.innerHTML='<main><div class="card">Votre profil ne possède pas encore d’espace actif.</div></main>';return}
 await loadEnglishClasses();staffShell();
}
async function loadEnglishClasses(){
 if(M.staff){
  const {data}=await sb.from('class_subjects').select('class_id,classes(id,name,code,academic_year_id,levels(name,sort_order)),subjects!inner(id,name,is_enabled)').eq('subject_id',M.english?.id).eq('subjects.is_enabled',true);
  M.eclasses=(data||[]).map(x=>x.classes).filter(Boolean);
 }else{
  const {data}=await sb.from('teacher_assignments').select('class_id,classes(id,name,code,academic_year_id,levels(name,sort_order)),subjects!inner(id,name,is_enabled)').eq('teacher_id',M.teacher.id).eq('subject_id',M.english?.id).eq('subjects.is_enabled',true);
  M.eclasses=(data||[]).map(x=>x.classes).filter(Boolean);
 }
 M.eclasses=[...new Map(M.eclasses.map(x=>[x.id,x])).values()].sort((a,b)=>(a.levels?.sort_order||0)-(b.levels?.sort_order||0)||a.name.localeCompare(b.name));M.cls=M.eclasses[0]?.id;
}
function passwordForm(mode='reset'){
 app.innerHTML='<div class="loginwrap"><div class="card lg"><div class="hero card" style="margin:-16px -16px 16px;border:0"><h1 style="margin:0">I2School</h1><div class="mu">Sécurisation du compte</div></div><h2>Créer votre mot de passe</h2><p class="mu">Choisissez le mot de passe que vous utiliserez avec votre adresse e-mail pour les prochaines connexions.</p><div class="field"><label>Nouveau mot de passe *</label><input id="rp1" type="password" autocomplete="new-password" minlength="8"></div><div class="field"><label>Confirmer le mot de passe *</label><input id="rp2" type="password" autocomplete="new-password" minlength="8"></div><button class="p" id="rpBtn" style="width:100%">Enregistrer le mot de passe</button><p id="rpMsg" class="mu" style="margin-top:10px"></p></div></div>';
 const run=async()=>{const p=rp1.value,p2=rp2.value;if(p.length<8)return toast('Le mot de passe doit contenir au moins 8 caractères.',true);if(p!==p2)return toast('Les deux mots de passe ne correspondent pas.',true);rpBtn.disabled=true;const {error}=await sb.auth.updateUser({password:p});rpBtn.disabled=false;if(error){toast(error.message||'Impossible d’enregistrer le mot de passe.',true);return}history.replaceState({},document.title,location.pathname+location.search);toast('Mot de passe enregistré. Vous pouvez maintenant vous reconnecter.');setTimeout(()=>{sb.auth.signOut().then(()=>login())},700)};
 rpBtn.onclick=run;rp2.onkeydown=e=>{if(e.key==='Enter')run()};
}
function login(){
 app.innerHTML='<div class="loginwrap"><div class="card lg"><div class="hero card" style="margin:-16px -16px 16px;border:0"><h1 style="margin:0">I2School</h1><div class="mu">Espace Anglais · Lycée Mikolongo</div></div><h2>Connexion</h2><p class="mu">Élève, parent, enseignant ou administrateur</p><div class="field"><label>Adresse e-mail</label><input id="le" type="email" autocomplete="username"></div><div class="field"><label>Mot de passe</label><input id="lp" type="password" autocomplete="current-password"></div><button class="p" id="loginBtn" style="width:100%">Se connecter</button><button id="forgotBtn" style="width:100%;margin-top:8px">Première connexion / mot de passe oublié</button><p class="mu" style="margin-top:8px">Si vous avez reçu une invitation mais n’avez jamais créé de mot de passe, utilisez ce bouton.</p></div></div>';
 const run=async()=>{const {error}=await sb.auth.signInWithPassword({email:le.value.trim(),password:lp.value});if(error)toast('Identifiants incorrects',true);else location.reload()};
 loginBtn.onclick=run;lp.onkeydown=e=>{if(e.key==='Enter')run()};
 forgotBtn.onclick=async()=>{const email=le.value.trim();if(!/^\\S+@\\S+\\.\\S+$/.test(email))return toast('Saisissez d’abord votre adresse e-mail.',true);const {error}=await sb.auth.resetPasswordForEmail(email,{redirectTo:'https://i2school.netlify.app/'});if(error)toast(error.message||'Impossible d’envoyer le lien.',true);else toast('Un e-mail de création/réinitialisation du mot de passe a été envoyé.');};
}
function shell(tabs){
 app.innerHTML='<header><div class="brand">I2School <small>Lycée Mikolongo · Anglais</small></div><nav id="nav">'+tabs.map(x=>'<button data-tab="'+x[0]+'">'+x[1]+'</button>').join('')+'</nav><div><span class="tag">'+esc(M.me.role)+'</span> <button id="logout">Quitter</button></div></header><main id="view"></main>';
 document.getElementById('logout').onclick=async()=>{await sb.auth.signOut();location.reload()};
 document.querySelectorAll('#nav button').forEach(b=>b.onclick=()=>go(b.dataset.tab));go(tabs[0][0])
}
function staffShell(){shell([['home','Accueil'],['classes','Mes classes'],['access','Accès'],['notes','Notes'],['bulletins','Bulletins'],['cahier','Cahier de textes'],['comms','Informations'],['inbox','Messages'],['edt','Emploi du temps']])}
function learnerShell(){shell([['home','Accueil'],['notes','Mes notes'],['bulletins','Mes bulletins'],['cahier','Cahier de textes'],['comms','Informations'],['inbox','Messages'],['edt','Emploi du temps']])}
function go(t){M.tab=t;document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('on',b.dataset.tab===t));({home,classes,access,notes,bulletins,cahier,comms,inbox,edt}[t]?.())}
const V=()=>document.getElementById('view');

async function home(){
 if(M.staff||M.teacher){
  const [st,ev,rc,msg]=await Promise.all([
   sb.from('students').select('*',{count:'exact',head:true}),
   sb.from('assessments').select('*',{count:'exact',head:true}).eq('subject_id',M.english?.id),
   sb.from('report_cards').select('status').eq('academic_year_id',M.eclasses[0]?.academic_year_id),
   sb.from('messages').select('id',{count:'exact',head:true}).eq('recipient_profile_id',M.me.id).is('read_at',null)
  ]);
  const by={};(rc.data||[]).forEach(x=>by[x.status]=(by[x.status]||0)+1);
  V().innerHTML='<div class="card hero"><h2 style="margin:0 0 6px">Espace Anglais</h2><div class="mu">Gestion des classes, notes, bulletins et échanges autour de l’anglais.</div></div><div class="grid"><div class="card"><div class="k">'+(M.eclasses?.length||0)+'</div><div class="mu">Classes d’anglais</div></div><div class="card"><div class="k">'+(st.count||0)+'</div><div class="mu">Élèves de l’établissement</div></div><div class="card"><div class="k">'+(ev.count||0)+'</div><div class="mu">Évaluations d’anglais</div></div><div class="card"><div class="k">'+(msg.count||0)+'</div><div class="mu">Messages non lus</div></div></div><div class="card"><b>Bulletins</b><div class="bar" style="margin-top:8px">'+Object.keys(ST).map(s=>'<span class="tag">'+ST[s]+' : '+(by[s]||0)+'</span>').join('')+'</div></div><div class="card"><b>Mode actuel</b><p class="mu">La plateforme conserve l’architecture complète de l’établissement, mais l’espace utilisateur est volontairement limité à la matière <b>Anglais</b>.</p></div>';
 }else{
  if(M.student){const q=await sb.from('enrollments').select('class_id,classes(name,levels(name))').eq('student_id',M.student.id).is('withdrawn_at',null).order('enrolled_at',{ascending:false}).limit(1).maybeSingle();const c=q.data?.classes;V().innerHTML='<div class="card hero"><h2 style="margin:0">Espace Anglais</h2><p class="mu">Bonjour '+esc(M.student.first_name)+'. Voici votre suivi en anglais.</p></div><div class="card"><b>Classe</b><p>'+esc(c?.name||'')+' · '+esc(c?.levels?.name||'')+'</p></div>'}
  else{const q=await sb.from('parent_student').select('student_id,students(id,first_name,last_name)').eq('parent_id',M.parent.id);M.children=(q.data||[]).map(x=>x.students);V().innerHTML='<div class="card hero"><h2 style="margin:0">Espace Parent</h2><p class="mu">Suivi des élèves rattachés à votre compte — matière : anglais.</p></div><div class="card">'+(M.children||[]).map(x=>'<span class="tag" style="margin:4px">'+esc(x.first_name)+' '+esc(x.last_name)+'</span>').join('')+'</div>'}
 }
}

async function access(){
 if(!M.staff){V().innerHTML='<div class="card">Accès réservé à l’administration.</div>';return}
 const [st,pa]=await Promise.all([
  sb.from('students').select('id,first_name,last_name,student_number,email,profile_id').order('last_name').limit(1000),
  sb.from('parents').select('id,first_name,last_name,email,phone,profile_id').order('last_name').limit(1000)
 ]);
 if(st.error||pa.error){V().innerHTML='<div class="card">'+esc(st.error?.message||pa.error?.message||'Erreur de chargement')+'</div>';return}
 const students=st.data||[], parents=pa.data||[];
 V().innerHTML='<div class="card hero"><h2 style="margin:0 0 6px">Accès utilisateurs</h2><div class="mu">Créez un accès sécurisé pour un élève ou un parent. I2School envoie directement l’invitation par e-mail.</div></div>'+
 '<div class="card sc"><div class="bar"><b>Élèves</b><span class="tag">'+students.length+' élèves</span></div>'+
 '<table><tr><th>Élève</th><th>Matricule</th><th>E-mail</th><th>Accès</th><th></th></tr>'+
 students.map(x=>'<tr><td><b>'+esc(x.last_name)+' '+esc(x.first_name)+'</b></td><td>'+esc(x.student_number||'—')+'</td><td>'+esc(x.email||'—')+'</td><td><span class="tag">'+(x.profile_id?'Accès créé':'Pas encore d’accès')+'</span></td><td>'+(x.profile_id?'<span class="mu">Déjà activé</span>':'<button data-grant="student" data-id="'+x.id+'">Donner un accès</button>')+'</td></tr>').join('')+
 '</table></div>'+
 '<div class="card sc"><div class="bar"><b>Parents</b><span class="tag">'+parents.length+' parents</span></div>'+
 '<table><tr><th>Parent</th><th>Téléphone</th><th>E-mail</th><th>Accès</th><th></th></tr>'+
 parents.map(x=>'<tr><td><b>'+esc(x.last_name)+' '+esc(x.first_name)+'</b></td><td>'+esc(x.phone||'—')+'</td><td>'+esc(x.email||'—')+'</td><td><span class="tag">'+(x.profile_id?'Accès créé':'Pas encore d’accès')+'</span></td><td>'+(x.profile_id?'<span class="mu">Déjà activé</span>':'<button data-grant="parent" data-id="'+x.id+'">Donner un accès</button>')+'</td></tr>').join('')+
 '</table></div>';
 V().querySelectorAll('[data-grant]').forEach(b=>b.onclick=()=>grantAccess(b.dataset.grant,b.dataset.id));
}
async function grantAccess(kind,id){
 const label=kind==='student'?'élève':'parent';
 const current=await (kind==='student'
   ? sb.from('students').select('first_name,last_name,email,profile_id').eq('id',id).maybeSingle()
   : sb.from('parents').select('first_name,last_name,email,profile_id').eq('id',id).maybeSingle());
 if(current.error||!current.data){toast('Utilisateur introuvable',true);return}
 if(current.data.profile_id){toast('Cet utilisateur possède déjà un accès.',true);return}
 const email=prompt('Adresse e-mail de '+label+' '+current.data.first_name+' '+current.data.last_name+':',current.data.email||'');
 if(email===null)return;
 const clean=email.trim().toLowerCase();
 if(!clean||!/^\S+@\S+\.\S+$/.test(clean)){toast('Adresse e-mail invalide.',true);return}
 if(!confirm('Envoyer une invitation à '+clean+' ?'))return;
 const {data,error}=await sb.functions.invoke('admin-invite-user',{body:{
   email:clean,first_name:current.data.first_name,last_name:current.data.last_name,role:kind,school_id:M.me.school_id
 }});
 if(error){toast(error.message||'Invitation impossible',true);return}
 const profileId=data?.profile?.id;
 if(!profileId){toast('Invitation envoyée mais le profil n’a pas été retourné.',true);return}
 const table=kind==='student'?'students':'parents';
 const {error:linkError}=await sb.from(table).update({profile_id:profileId,email:clean}).eq('id',id);
 if(linkError){toast('Compte créé mais liaison au dossier impossible : '+linkError.message,true);return}
 toast('Invitation envoyée à '+clean);
 access();
}

async function classes(){
 V().innerHTML='<div class="bar"><select id="classPick"></select>'+(M.staff?'<button class="p" id="newStudentBtn">+ Nouvel élève</button>':'')+'<button id="addExistingBtnTop">Ajouter un élève existant</button></div><div id="rosterView"></div>';
 const pick=document.getElementById('classPick');
 pick.innerHTML=opts(M.eclasses,'id',x=>x.name,M.cls);
 pick.value=M.cls||M.eclasses[0]?.id||'';
 M.cls=pick.value;
 pick.onchange=()=>{M.cls=pick.value;renderRoster()};
 document.getElementById('newStudentBtn')?.addEventListener('click',studentForm);
 document.getElementById('addExistingBtnTop').addEventListener('click',existingStudentForm);
 await renderRoster();
}
async function renderRoster(){
 const pick=document.getElementById('classPick'); if(!pick)return;
 M.cls=pick.value;
 const box=document.getElementById('rosterView');
 box.innerHTML='<div class="card empty">Chargement des élèves…</div>';

async function gradeGrid(id){

  sb.from('assessment_results').select('id,student_id,score,status,students(first_name,last_name,student_number)').eq('assessment_id',id),
  sb.from('assessments').select('id,status,max_score,title,assessment_type,assessment_date').eq('id',id).single()
 ]);
 if(error||ae){box.innerHTML='<div class="card">'+esc((error||ae).message)+'</div>';return}
 const locked=ass.status==='locked';
 const rows=(data||[]).sort((a,b)=>String(a.students?.last_name||'').localeCompare(String(b.students?.last_name||'')));
 box.innerHTML='<div class="card sc"><div class="bar"><div style="margin-right:auto"><b>'+esc(ass.title)+'</b><div class="mu">'+esc(ass.assessment_date||'')+' · '+esc(ass.assessment_type||'')+' · /'+ass.max_score+'</div></div><span class="tag">'+ST[ass.status]+'</span></div><table><tr><th>Élève</th><th>Note /'+ass.max_score+'</th><th>Statut</th></tr>'+rows.map(x=>'<tr data-result-id="'+x.id+'"><td>'+esc(x.students?.last_name||'')+' '+esc(x.students?.first_name||'')+' <span class="mu">'+esc(x.students?.student_number||'')+'</span></td><td><input class="gradeValue" type="number" min="0" max="'+ass.max_score+'" step=".25" value="'+(x.score??'')+'" '+(locked?'disabled':'')+'></td><td><select class="gradeStatus" '+(locked?'disabled':'')+'>'+['present','absent','excused','missing'].map(s=>'<option value="'+s+'" '+(s===x.status?'selected':'')+'>'+s+'</option>').join('')+'</select></td></tr>').join('')+'</table><div class="bar"><button class="p" id="saveGradesBtn" '+(locked?'disabled':'')+'>Enregistrer les notes</button><button id="publishEvalBtn" '+(locked?'disabled':'')+'>Publier l’évaluation</button></div></div>';
 document.getElementById('saveGradesBtn')?.addEventListener('click',async()=>{
   const results=[...box.querySelectorAll('tr[data-result-id]')].map(tr=>{const status=tr.querySelector('.gradeStatus').value;const raw=tr.querySelector('.gradeValue').value;return{result_id:tr.dataset.resultId,score:status==='present'&&raw!==''?Number(raw):null,status}});
   const btn=document.getElementById('saveGradesBtn');btn.disabled=true;
   const {error}=await sb.rpc('save_english_assessment_results',{p_assessment_id:id,p_results:results});
   btn.disabled=false;if(error)toast(error.message,true);else toast('Notes enregistrées.');
 });
 document.getElementById('publishEvalBtn')?.addEventListener('click',async()=>{
   if(!confirm('Publier cette évaluation ? Les élèves pourront alors voir les résultats.'))return;

   if(error)toast(error.message,true);else{toast('Évaluation publiée.');await refreshEvaluationList();await gradeGrid(id)}
 });
}

  if(!children.length){
   const q=await sb.from('parent_student').select('student_id,students(id,first_name,last_name)').eq('parent_id',M.parent.id);
   M.children=(q.data||[]).map(x=>x.students).filter(Boolean);
  }
  if((M.children||[]).length>1){
   const selected=prompt('Nom de l’élève à consulter :\n'+M.children.map(x=>x.first_name+' '+x.last_name).join('\n'));
   const child=M.children.find(x=>(x.first_name+' '+x.last_name).toLowerCase()===String(selected||'').trim().toLowerCase());
   if(!child)return;
   const q=await sb.from('enrollments').select('class_id').eq('student_id',child.id).is('withdrawn_at',null).order('enrolled_at',{ascending:false}).limit(1).maybeSingle();classId=q.data?.class_id;
  }else if(M.children?.[0]){
   const q=await sb.from('enrollments').select('class_id').eq('student_id',M.children[0].id).is('withdrawn_at',null).order('enrolled_at',{ascending:false}).limit(1).maybeSingle();classId=q.data?.class_id;
  }
 }
 const canManage=!!(M.staff||M.teacher);
 if(canManage){
  const classes=M.eclasses||[];
  const clsOpts=classes.map(x=>'<option value="'+x.id+'">'+esc(x.name)+'</option>').join('');
  V().innerHTML='<div class="bar"><h2 style="margin-right:auto">Cahier de textes</h2><button class="p" id="addLesson">+ Cours</button><button id="addHomework">+ Devoir</button></div><div class="card"><div class="two"><div class="field"><label>Classe</label><select id="bookClass">'+clsOpts+'</select></div><div class="field"><label>Affichage</label><select id="bookFilter"><option value="all">Cours et devoirs</option><option value="lessons">Cours</option><option value="homework">Devoirs</option></select></div></div></div><div id="bookList"></div>';
  const load=async()=>{
   const cid=bookClass.value;
   let lq=sb.from('lessons').select('id,lesson_date,title,content,classes(name),teachers(first_name,last_name)').eq('class_id',cid).order('lesson_date',{ascending:false}).limit(80);
   let hq=sb.from('homework').select('id,due_date,title,description,classes(name),teachers(first_name,last_name)').eq('class_id',cid).order('due_date',{ascending:false}).limit(80);
   const [lr,hr]=await Promise.all([lq,hq]);if(lr.error)return toast(lr.error.message,true);if(hr.error)return toast(hr.error.message,true);
   const filter=bookFilter.value;let html='';
   if(filter!=='homework')html+='<div class="card"><h3>Cours</h3>'+(lr.data||[]).map(x=>'<div class="msg"><div class="meta">'+esc(x.lesson_date||'')+' · '+esc(x.classes?.name||'')+'</div><b>'+esc(x.title)+'</b><p style="white-space:pre-wrap">'+esc(x.content||'')+'</p>'+((M.staff||M.teacher)?'<button data-del-lesson="'+x.id+'">Supprimer</button>':'')+'</div>').join('')||'<div class="empty">Aucun cours.</div>'+'</div>';
   if(filter!=='lessons')html+='<div class="card"><h3>Devoirs</h3>'+(hr.data||[]).map(x=>'<div class="msg"><div class="meta">À rendre le '+esc(x.due_date||'')+' · '+esc(x.classes?.name||'')+'</div><b>'+esc(x.title)+'</b><p style="white-space:pre-wrap">'+esc(x.description||'')+'</p>'+((M.staff||M.teacher)?'<button data-del-homework="'+x.id+'">Supprimer</button>':'')+'</div>').join('')||'<div class="empty">Aucun devoir.</div>'+'</div>';
   V().querySelector('#bookList').innerHTML=html||'<div class="card empty">Aucune entrée.</div>';
   V().querySelectorAll('[data-del-lesson]').forEach(b=>b.onclick=async()=>{if(!confirm('Supprimer ce cours ?'))return;const {error}=await sb.from('lessons').delete().eq('id',b.dataset.delLesson);if(error)toast(error.message,true);else load()});
   V().querySelectorAll('[data-del-homework]').forEach(b=>b.onclick=async()=>{if(!confirm('Supprimer ce devoir ?'))return;const {error}=await sb.from('homework').delete().eq('id',b.dataset.delHomework);if(error)toast(error.message,true);else load()});
  };
  bookClass.onchange=load;bookFilter.onchange=load;
  addLesson.onclick=()=>cahierForm('lesson',bookClass.value,load);
  addHomework.onclick=()=>cahierForm('homework',bookClass.value,load);
  if(!classes.length){V().innerHTML='<div class="card empty">Aucune classe d’anglais disponible.</div>';return}
  load();
 }else{
  if(!classId){V().innerHTML='<div class="card empty">Aucune classe active trouvée.</div>';return}
  const [lr,hr]=await Promise.all([
   sb.from('lessons').select('id,lesson_date,title,content,classes(name),teachers(first_name,last_name)').eq('class_id',classId).order('lesson_date',{ascending:false}).limit(80),
   sb.from('homework').select('id,due_date,title,description,classes(name),teachers(first_name,last_name)').eq('class_id',classId).order('due_date',{ascending:false}).limit(80)
  ]);
  if(lr.error)return toast(lr.error.message,true);if(hr.error)return toast(hr.error.message,true);
  V().innerHTML='<div class="card hero"><h2 style="margin:0">Cahier de textes</h2><p class="mu">Cours et devoirs d’anglais de votre classe.</p></div><div class="card"><h3>Cours</h3>'+((lr.data||[]).map(x=>'<div class="msg"><div class="meta">'+esc(x.lesson_date||'')+'</div><b>'+esc(x.title)+'</b><p style="white-space:pre-wrap">'+esc(x.content||'')+'</p></div>').join('')||'<div class="empty">Aucun cours.</div>')+'</div><div class="card"><h3>Devoirs</h3>'+((hr.data||[]).map(x=>'<div class="msg"><div class="meta">À rendre le '+esc(x.due_date||'')+'</div><b>'+esc(x.title)+'</b><p style="white-space:pre-wrap">'+esc(x.description||'')+'</p></div>').join('')||'<div class="empty">Aucun devoir.</div>')+'</div>';
 }
}
async function cahierForm(kind,classId,refresh){
 const title=kind==='lesson'?'Ajouter un cours':'Ajouter un devoir';
 const html=kind==='lesson'?'<div class="field"><label>Date du cours *</label><input id="cfDate" type="date" value="'+new Date().toISOString().slice(0,10)+'"></div><div class="field"><label>Titre *</label><input id="cfTitle" placeholder="Ex. Present Simple"></div><div class="field"><label>Contenu</label><textarea id="cfContent" placeholder="Résumé du cours, activités, travail réalisé..."></textarea></div>':'<div class="field"><label>Date limite *</label><input id="cfDate" type="date"></div><div class="field"><label>Titre *</label><input id="cfTitle" placeholder="Ex. Exercise on the Present Simple"></div><div class="field"><label>Consignes</label><textarea id="cfContent" placeholder="Travail à faire..."></textarea></div>';
 modal('<button class="close" onclick="closeModal()">×</button><h2>'+title+'</h2>'+html+'<div class="bar"><button onclick="closeModal()">Annuler</button><button class="p" id="cfSave">Enregistrer</button></div>');
 cfSave.onclick=async()=>{
  if(!cfDate.value||!cfTitle.value.trim())return toast('Date et titre obligatoires',true);
  const teacherId=M.teacher?.id;
  if(!teacherId)return toast('Aucun profil enseignant associé à ce compte.',true);
  let payload=kind==='lesson'?{school_id:M.me.school_id,academic_year_id:M.eclasses.find(x=>x.id===classId)?.academic_year_id,class_id:classId,subject_id:M.english.id,teacher_id:teacherId,lesson_date:cfDate.value,title:cfTitle.value.trim(),content:cfContent.value.trim()||null}:{school_id:M.me.school_id,academic_year_id:M.eclasses.find(x=>x.id===classId)?.academic_year_id,class_id:classId,subject_id:M.english.id,teacher_id:teacherId,due_date:cfDate.value,title:cfTitle.value.trim(),description:cfContent.value.trim()||null};
  const {error}=await sb.from(kind==='lesson'?'lessons':'homework').insert(payload);
  if(error)toast(error.message,true);else{closeModal();toast(kind==='lesson'?'Cours ajouté au cahier.':'Devoir ajouté au cahier.');refresh()}
 };
}
async function edt(){
 let q=sb.from('timetable').select('day_of_week,start_time,end_time,subjects(name),teachers(last_name),classes(name),rooms(name)').order('start_time');
 if(M.teacher)q=q.eq('teacher_id',M.teacher.id);
 else if(M.student){const e=await sb.from('enrollments').select('class_id').eq('student_id',M.student.id).is('withdrawn_at',null).limit(1).maybeSingle();q=q.eq('class_id',e.data?.class_id)}
 else{V().innerHTML='<div class="card empty">L’emploi du temps détaillé sera affiché lorsque la classe sera sélectionnée.</div>';return}
 const {data,error}=await q;if(error)return toast(error.message,true);const days=['Lun','Mar','Mer','Jeu','Ven'];V().innerHTML='<div class="card sc"><h2>Emploi du temps</h2><table><tr><th>Jour</th><th>Heure</th><th>Matière</th><th>Classe</th><th>Salle</th></tr>'+(data||[]).map(x=>'<tr><td>'+days[(x.day_of_week||1)-1]+'</td><td>'+esc((x.start_time||'').slice(0,5))+'–'+esc((x.end_time||'').slice(0,5))+'</td><td>'+esc(x.subjects?.name||'')+'</td><td>'+esc(x.classes?.name||'')+'</td><td>'+esc(x.rooms?.name||'')+'</td></tr>').join('')+'</table></div>'
}
boot();
</script>
</body></html>
