<script>
const sb=supabase.createClient('https://bkuhcxgmxrbjydkuklgo.supabase.co','sb_publishable_rjpYK53ugeDJrVoRo2B6mQ_5raQHAVU');
const app=document.getElementById('app'),toastEl=document.getElementById('toastRoot'),M={};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money=n=>n==null?'—':Number(n).toFixed(2),ST={draft:'Brouillon',validated:'Validé',published:'Publié',locked:'Verrouillé'};

function requestAdminDeleteCode(){
 return new Promise(resolve=>{
  modal('<h2>Confirmation administrateur</h2><p class="mu">Saisissez le code d’accès administrateur pour autoriser cette suppression.</p><div class="field"><label for="deleteAdminCode">Code d’accès</label><input id="deleteAdminCode" type="password" autocomplete="off" placeholder="Code administrateur" style="width:100%"></div><div class="bar"><button id="cancelDeleteCode">Annuler</button><button id="confirmDeleteCode" class="p">Autoriser la suppression</button></div>');
  const input=document.getElementById('deleteAdminCode');
  const finish=value=>{closeModal();resolve(value)};
  document.getElementById('cancelDeleteCode').onclick=()=>finish(null);
  document.getElementById('confirmDeleteCode').onclick=()=>finish(input.value.trim()||null);
  input.addEventListener('keydown',e=>{if(e.key==='Enter')finish(input.value.trim()||null);if(e.key==='Escape')finish(null)});
  input.focus();
 });
}
const opts=(a,v,l,sel)=>a.map(x=>'<option value="'+esc(x[v])+'"'+(x[v]==sel?' selected':'')+'>'+esc(l(x))+'</option>').join('');

function authInviteState(){
 const hash=new URLSearchParams(location.hash.replace(/^#/,''));
 const type=hash.get('type');
 const hasAccessToken=hash.has('access_token');
 const error=hash.get('error');
 const errorCode=hash.get('error_code');
 const description=hash.get('error_description');
 if(error||errorCode)return {error, errorCode, description:description?decodeURIComponent(description):''};
 return {type,hasAccessToken};
}
async function invitationSetup(){
 const s=authInviteState();
 if(s.type==='recovery'){
  const {data:{session},error}=await sb.auth.getSession();
  if(error||!session){app.innerHTML='<div class="loginwrap"><div class="card lg"><h2>Réinitialisation du mot de passe</h2><p class="mu">Le lien de réinitialisation n’est plus valide. Demandez un nouveau lien depuis la page de connexion.</p></div></div>';return true;}
  passwordForm('reset');return true;
 }
 if(s.error||s.errorCode){
  app.innerHTML='<div class="loginwrap"><div class="card lg"><div class="hero card" style="margin:-16px -16px 16px;border:0"><h1 style="margin:0">I2School</h1><div class="mu">Activation du compte</div></div><h2>Lien d’invitation invalide ou expiré</h2><p class="mu">'+esc(s.description||'Le lien utilisé n’est plus valide.')+'</p><p class="mu">Demandez à l’administration de vous envoyer une nouvelle invitation.</p><button class="p" style="width:100%" onclick="location.hash=&quot;&quot;;location.reload()">Retour à la connexion</button></div></div>';
  return true;
 }
 if(s.type!=='invite' && !(s.hasAccessToken && s.type!=='recovery'))return false;
 const {data:{session},error}=await sb.auth.getSession();
 if(error||!session){
  app.innerHTML='<div class="loginwrap"><div class="card lg"><h2>Activation du compte</h2><p class="mu">La session d’invitation n’est pas disponible. Ouvrez le lien reçu dans votre e-mail.</p></div></div>';
  return true;
 }
 app.innerHTML='<div class="loginwrap"><div class="card lg"><div class="hero card" style="margin:-16px -16px 16px;border:0"><h1 style="margin:0">I2School</h1><div class="mu">Activation de votre compte</div></div><h2>Créez votre mot de passe</h2><p class="mu">Choisissez le mot de passe qui vous servira à vous connecter à I2School.</p><div class="field"><label>Mot de passe *</label><input id="invitePw" type="password" autocomplete="new-password" minlength="8"></div><div class="field"><label>Confirmer le mot de passe *</label><input id="invitePw2" type="password" autocomplete="new-password" minlength="8"></div><button class="p" id="activateBtn" style="width:100%">Activer mon compte</button><p id="inviteMsg" class="mu" style="margin-top:10px"></p></div></div>';
 const activate=async()=>{
  const p=invitePw.value,p2=invitePw2.value;
  if(p.length<8)return toast('Le mot de passe doit contenir au moins 8 caractères.',true);
  if(p!==p2)return toast('Les deux mots de passe ne correspondent pas.',true);
  activateBtn.disabled=true;
  const {error}=await sb.auth.updateUser({password:p});
  activateBtn.disabled=false;
  if(error){toast(error.message||'Activation impossible',true);return}
  history.replaceState({},document.title,location.pathname+location.search);
  toast('Compte activé. Bienvenue sur I2School.');
  setTimeout(()=>boot(),400);
 };
 activateBtn.onclick=activate;
 invitePw2.onkeydown=e=>{if(e.key==='Enter')activate()};
 return true;
}
async function boot(){
 if(await invitationSetup())return;
 const {data:{session}}=await sb.auth.getSession();if(!session)return login();
 const {data:me,error}=await sb.from('profiles').select('*').eq('auth_user_id',session.user.id).maybeSingle();
 if(error||!me){app.innerHTML='<main><div class="card">Profil introuvable pour ce compte.</div></main>';return}
 M.me=me;M.staff=['admin','school_life'].includes(me.role);if(me.must_change_password){passwordForm('first');return;}
 M.teacher=(await sb.from('teachers').select('id,profile_id').eq('profile_id',me.id).maybeSingle()).data;
 M.student=(await sb.from('students').select('id,first_name,last_name,student_number').eq('profile_id',me.id).maybeSingle()).data;
 M.parent=(await sb.from('parents').select('id').eq('profile_id',me.id).maybeSingle()).data;
 const [ty,cl,en]=await Promise.all([
  sb.from('terms').select('id,name,term_number,status').order('term_number'),
  sb.from('classes').select('id,name,code,academic_year_id,level_id,levels(name,sort_order)').order('name'),
  sb.from('subjects').select('id,name,is_enabled').eq('name','Anglais').maybeSingle()
 ]);
 M.terms=ty.data||[];M.classes=cl.data||[];M.english=en.data;M.term=(M.terms.find(x=>x.status==='active')||M.terms[0])?.id;
 if(M.student||M.parent)return learnerShell();
 if(!M.staff&&!M.teacher){app.innerHTML='<main><div class="card">Votre profil ne possède pas encore d’espace actif.</div></main>';return}
 await loadEnglishClasses();staffShell();
}
async function loadEnglishClasses(){
 if(M.staff){
  const {data}=await sb.from('class_subjects').select('class_id,classes(id,name,code,academic_year_id,levels(name,sort_order)),subjects!inner(id,name,is_enabled)').eq('subject_id',M.english?.id).eq('subjects.is_enabled',true);
  M.eclasses=(data||[]).map(x=>x.classes).filter(Boolean);
 }else{
  const {data}=await sb.from('teacher_assignments').select('class_id,classes(id,name,code,academic_year_id,levels(name,sort_order)),subjects!inner(id,name,is_enabled)').eq('teacher_id',M.teacher.id).eq('subject_id',M.english?.id).eq('subjects.is_enabled',true);
  M.eclasses=(data||[]).map(x=>x.classes).filter(Boolean);
 }
 M.eclasses=[...new Map(M.eclasses.map(x=>[x.id,x])).values()].sort((a,b)=>(a.levels?.sort_order||0)-(b.levels?.sort_order||0)||a.name.localeCompare(b.name));M.cls=M.eclasses[0]?.id;
}
function passwordForm(mode='reset'){
 app.innerHTML='<div class="loginwrap"><div class="card lg"><div class="hero card" style="margin:-16px -16px 16px;border:0"><h1 style="margin:0">I2School</h1><div class="mu">Sécurisation du compte</div></div><h2>Créer votre mot de passe</h2><p class="mu">Choisissez le mot de passe personnel que vous utiliserez désormais avec votre identifiant I2School.</p><div class="field"><label>Nouveau mot de passe *</label><input id="rp1" type="password" autocomplete="new-password" minlength="8"></div><div class="field"><label>Confirmer le mot de passe *</label><input id="rp2" type="password" autocomplete="new-password" minlength="8"></div><button class="p" id="rpBtn" style="width:100%">Enregistrer le mot de passe</button><p id="rpMsg" class="mu" style="margin-top:10px"></p></div></div>';
 const run=async()=>{const p=rp1.value,p2=rp2.value;if(p.length<8)return toast('Le mot de passe doit contenir au moins 8 caractères.',true);if(p!==p2)return toast('Les deux mots de passe ne correspondent pas.',true);rpBtn.disabled=true;const {error}=await sb.auth.updateUser({password:p});if(error){rpBtn.disabled=false;toast(error.message||'Impossible d’enregistrer le mot de passe.',true);return}const {error:clearError}=await sb.rpc('clear_must_change_password');rpBtn.disabled=false;if(clearError){toast('Mot de passe enregistré, mais une erreur technique est survenue ('+clearError.message+'). Contactez l’administration si la reconnexion échoue.',true)}history.replaceState({},document.title,location.pathname+location.search);toast('Mot de passe enregistré. Vous pouvez maintenant vous reconnecter.');setTimeout(()=>{sb.auth.signOut().then(()=>login())},700)};
 rpBtn.onclick=run;rp2.onkeydown=e=>{if(e.key==='Enter')run()};
}
function identifierToEmail(identifier){
 const id=String(identifier||'').trim().toLowerCase();
 if(!id)return '';
 if(id.includes('@'))return id;
 if(id.startsWith('p-'))return id+'@parents.i2school.local';
 return id+'@eleves.i2school.local';
}
function login(){
 app.innerHTML='<div class="loginwrap"><div class="card lg"><div class="hero card" style="margin:-16px -16px 16px;border:0"><h1 style="margin:0">I2School</h1><div class="mu">Espace Anglais · Lycée Mikolongo</div></div><h2>Connexion</h2><p class="mu">Élève ou parent : utilisez votre <b>identifiant</b> (matricule). Les enseignants et administrateurs peuvent utiliser leur adresse e-mail.</p><div class="field"><label>Identifiant</label><input id="li" type="text" autocomplete="username" placeholder="Ex. 3E-M1-001 ou P-3E-M1-001"></div><div class="field"><label>Mot de passe</label><input id="lp" type="password" autocomplete="current-password"></div><button class="p" id="loginBtn" style="width:100%">Se connecter</button><button id="forgotBtn" style="width:100%;margin-top:8px">Première connexion / mot de passe oublié</button><p class="mu" style="margin-top:8px">À la première connexion, I2School vous demandera de choisir votre mot de passe personnel.</p></div></div>';
 const run=async()=>{
  const identifier=li.value.trim();
  if(!identifier)return toast('Saisissez votre identifiant.',true);
  const email=identifierToEmail(identifier);
  const {error}=await sb.auth.signInWithPassword({email,password:lp.value});
  if(error)toast('Identifiant ou mot de passe incorrect.',true);else location.reload()
 };
 loginBtn.onclick=run;lp.onkeydown=e=>{if(e.key==='Enter')run()};
 forgotBtn.onclick=async()=>{
  const identifier=li.value.trim();const email=identifierToEmail(identifier);
  if(!email)return toast('Saisissez d’abord votre identifiant.',true);
  const {error}=await sb.auth.resetPasswordForEmail(email,{redirectTo:'https://i2school.netlify.app/'});
  if(error)toast('Impossible d’envoyer le lien de réinitialisation.',true);else toast('Un lien de réinitialisation a été envoyé si le compte existe.');
 };
}
function shell(tabs){
 app.innerHTML='<header><div class="brand">I2School <small>Lycée Mikolongo · Anglais</small></div><nav id="nav">'+tabs.map(x=>'<button data-tab="'+x[0]+'">'+x[1]+'</button>').join('')+'</nav><div><span class="tag">'+esc(M.me.role)+'</span> <button id="logout">Quitter</button></div></header><main id="view"></main>';
 document.getElementById('logout').onclick=async()=>{await sb.auth.signOut();location.reload()};
 document.querySelectorAll('#nav button').forEach(b=>b.onclick=()=>go(b.dataset.tab));go(tabs[0][0])
}
function staffShell(){shell([['home','Accueil'],['classes','Mes classes'],['access','Accès'],['notes','Notes'],['matrix','Tableau de notes'],['quizzes','Quiz'],['bulletins','Bulletins'],['cahier','Cahier de textes'],['comms','Informations'],['inbox','Messages'],['edt','Emploi du temps']])}
function learnerShell(){shell([['home','Accueil'],['notes','Mes notes'],['quizzes','Quiz'],['bulletins','Mes bulletins'],['cahier','Cahier de textes'],['comms','Informations'],['inbox','Messages'],['edt','Emploi du temps']])}
function go(t){M.tab=t;document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('on',b.dataset.tab===t));({home,classes,access,notes,matrix,quizzes,bulletins,cahier,comms,inbox,edt}[t]?.())}
const V=()=>document.getElementById('view');

async function home(){
 if(M.staff||M.teacher){
  const [st,ev,rc,msg]=await Promise.all([
   sb.from('students').select('*',{count:'exact',head:true}),
   sb.from('assessments').select('*',{count:'exact',head:true}).eq('subject_id',M.english?.id),
   sb.from('report_cards').select('status').eq('academic_year_id',M.eclasses[0]?.academic_year_id),
   sb.from('messages').select('id',{count:'exact',head:true}).eq('recipient_profile_id',M.me.id).is('read_at',null)
  ]);
  const by={};(rc.data||[]).forEach(x=>by[x.status]=(by[x.status]||0)+1);
  V().innerHTML='<div class="card hero"><h2 style="margin:0 0 6px">Espace Anglais</h2><div class="mu">Gestion des classes, notes, bulletins et échanges autour de l’anglais.</div></div><div class="grid"><div class="card"><div class="k">'+(M.eclasses?.length||0)+'</div><div class="mu">Classes d’anglais</div></div><div class="card"><div class="k">'+(st.count||0)+'</div><div class="mu">Élèves de l’établissement</div></div><div class="card"><div class="k">'+(ev.count||0)+'</div><div class="mu">Évaluations d’anglais</div></div><div class="card"><div class="k">'+(msg.count||0)+'</div><div class="mu">Messages non lus</div></div></div><div class="card"><b>Bulletins</b><div class="bar" style="margin-top:8px">'+Object.keys(ST).map(s=>'<span class="tag">'+ST[s]+' : '+(by[s]||0)+'</span>').join('')+'</div></div><div class="card"><b>Mode actuel</b><p class="mu">La plateforme conserve l’architecture complète de l’établissement, mais l’espace utilisateur est volontairement limité à la matière <b>Anglais</b>.</p></div>';
 }else{
  if(M.student){const q=await sb.from('enrollments').select('class_id,classes(name,levels(name))').eq('student_id',M.student.id).is('withdrawn_at',null).order('enrolled_at',{ascending:false}).limit(1).maybeSingle();const c=q.data?.classes;V().innerHTML='<div class="card hero"><h2 style="margin:0">Espace Anglais</h2><p class="mu">Bonjour '+esc(M.student.first_name)+'. Voici votre suivi en anglais.</p></div><div class="card"><b>Classe</b><p>'+esc(c?.name||'')+' · '+esc(c?.levels?.name||'')+'</p></div>'}
  else{const q=await sb.from('parent_student').select('student_id,students(id,first_name,last_name)').eq('parent_id',M.parent.id);M.children=(q.data||[]).map(x=>x.students);V().innerHTML='<div class="card hero"><h2 style="margin:0">Espace Parent</h2><p class="mu">Suivi des élèves rattachés à votre compte — matière : anglais.</p></div><div class="card">'+(M.children||[]).map(x=>'<span class="tag" style="margin:4px">'+esc(x.first_name)+' '+esc(x.last_name)+'</span>').join('')+'</div>'}
 }
}

async function access(){
 if(!M.staff){V().innerHTML='<div class="card">Accès réservé à l’administration.</div>';return}
 const [st,pa]=await Promise.all([
  sb.from('students').select('id,first_name,last_name,student_number,email,profile_id').order('last_name').limit(1000),
  sb.from('parents').select('id,first_name,last_name,email,phone,profile_id').order('last_name').limit(1000)
 ]);
 if(st.error||pa.error){V().innerHTML='<div class="card">'+esc(st.error?.message||pa.error?.message||'Erreur de chargement')+'</div>';return}
 const students=st.data||[], parents=pa.data||[];
 V().innerHTML='<div class="card hero"><h2 style="margin:0 0 6px">Accès utilisateurs</h2><div class="mu">Créez un accès sécurisé pour un élève ou un parent. I2School envoie directement l’invitation par e-mail.</div></div>'+
 '<div class="card sc"><div class="bar"><b>Élèves</b><span class="tag">'+students.length+' élèves</span></div>'+
 '<table><tr><th>Élève</th><th>Matricule</th><th>E-mail</th><th>Accès</th><th></th></tr>'+
 students.map(x=>'<tr><td><b>'+esc(x.last_name)+' '+esc(x.first_name)+'</b></td><td>'+esc(x.student_number||'—')+'</td><td>'+esc(x.email||'—')+'</td><td><span class="tag">'+(x.profile_id?'Accès créé':'Pas encore d’accès')+'</span></td><td>'+(x.profile_id?'<span class="mu">Déjà activé</span>':'<button data-grant="student" data-id="'+x.id+'">Donner un accès</button>')+'</td></tr>').join('')+
 '</table></div>'+
 '<div class="card sc"><div class="bar"><b>Parents</b><span class="tag">'+parents.length+' parents</span></div>'+
 '<table><tr><th>Parent</th><th>Téléphone</th><th>E-mail</th><th>Accès</th><th></th></tr>'+
 parents.map(x=>'<tr><td><b>'+esc(x.last_name)+' '+esc(x.first_name)+'</b></td><td>'+esc(x.phone||'—')+'</td><td>'+esc(x.email||'—')+'</td><td><span class="tag">'+(x.profile_id?'Accès créé':'Pas encore d’accès')+'</span></td><td>'+(x.profile_id?'<span class="mu">Déjà activé</span>':'<button data-grant="parent" data-id="'+x.id+'">Donner un accès</button>')+'</td></tr>').join('')+
 '</table></div>';
 V().querySelectorAll('[data-grant]').forEach(b=>b.onclick=()=>grantAccess(b.dataset.grant,b.dataset.id));
}
async function grantAccess(kind,id){
 const label=kind==='student'?'élève':'parent';
 const current=await (kind==='student'
   ? sb.from('students').select('first_name,last_name,email,profile_id').eq('id',id).maybeSingle()
   : sb.from('parents').select('first_name,last_name,email,profile_id').eq('id',id).maybeSingle());
 if(current.error||!current.data){toast('Utilisateur introuvable',true);return}
 if(current.data.profile_id){toast('Cet utilisateur possède déjà un accès.',true);return}
 const email=prompt('Adresse e-mail de '+label+' '+current.data.first_name+' '+current.data.last_name+':',current.data.email||'');
 if(email===null)return;
 const clean=email.trim().toLowerCase();
 if(!clean||!/^\S+@\S+\.\S+$/.test(clean)){toast('Adresse e-mail invalide.',true);return}
 if(!confirm('Envoyer une invitation à '+clean+' ?'))return;

function parseMoodleXml(xmlText){
 const doc=new DOMParser().parseFromString(xmlText,'application/xml');
 if(doc.querySelector('parsererror'))throw new Error('Fichier XML invalide.');
 const questions=[...doc.querySelectorAll('question')].filter(q=>q.getAttribute('type')==='multichoice').map(q=>{
  const qtext=(q.querySelector('questiontext > text')?.textContent||'').trim();
  const choices=[...q.querySelectorAll('answer')].map(a=>({
   text:(a.querySelector('text')?.textContent||'').trim(),
   is_correct:parseFloat(a.getAttribute('fraction')||'0')>0
  })).filter(c=>c.text);
  return{question_text:qtext,points:1,choices};
 }).filter(q=>q.question_text&&q.choices.length>=2&&q.choices.some(c=>c.is_correct));
 if(!questions.length)throw new Error('Aucune question à choix unique exploitable dans ce fichier.');
 return questions;
}

async function compressQuizImage(file){
 if(!file||!/^image\/(jpeg|png|webp|gif)$/.test(file.type))throw new Error('Choisissez une image JPG, PNG, WebP ou GIF.');
 if(file.size>10*1024*1024)throw new Error('Image trop lourde à traiter (maximum 10 Mo avant compression).');
 const img=await new Promise((resolve,reject)=>{const u=URL.createObjectURL(file),im=new Image();im.onload=()=>{URL.revokeObjectURL(u);resolve(im)};im.onerror=()=>{URL.revokeObjectURL(u);reject(new Error('Impossible de lire cette image.'))};im.src=u});
 const scale=Math.min(1,1200/img.width,900/img.height),w=Math.max(1,Math.round(img.width*scale)),h=Math.max(1,Math.round(img.height*scale));
 const canvas=document.createElement('canvas');canvas.width=w;canvas.height=h;const ctx=canvas.getContext('2d');ctx.fillStyle='#fff';ctx.fillRect(0,0,w,h);ctx.drawImage(img,0,0,w,h);
 let blob=await new Promise(resolve=>canvas.toBlob(resolve,'image/webp',0.82));
 for(const quality of [0.72,0.62,0.5]){if(blob&&blob.size<=480*1024)break;blob=await new Promise(resolve=>canvas.toBlob(resolve,'image/webp',quality))}
 if(!blob||blob.size>500*1024)throw new Error('Cette image reste trop volumineuse après compression. Choisissez une image plus simple.');
 return blob;
}
function quizImageUrl(path){if(!path)return '';return sb.storage.from('quiz-question-images').getPublicUrl(path).data.publicUrl}
async function uploadQuizImage(file){
 const{data:{user},error}=await sb.auth.getUser();if(error||!user)throw new Error('Reconnectez-vous pour importer une image.');
 const blob=await compressQuizImage(file),path=user.id+'/'+Date.now()+'-'+Math.random().toString(36).slice(2,8)+'.webp';
 const{error:upError}=await sb.storage.from('quiz-question-images').upload(path,blob,{contentType:'image/webp',upsert:false});
 if(upError)throw upError;
 return path;
}

async function getLearnerClassId(){
 if(M.student){
  const q=await sb.from('enrollments').select('class_id,classes(name,levels(name))').eq('student_id',M.student.id).is('withdrawn_at',null).order('enrolled_at',{ascending:false}).limit(1).maybeSingle();
  return {classId:q.data?.class_id,child:M.student,className:q.data?.classes?.name};
 }
 if(M.parent){
  if(!M.children){const q=await sb.from('parent_student').select('student_id,students(id,first_name,last_name)').eq('parent_id',M.parent.id);M.children=(q.data||[]).map(x=>x.students).filter(Boolean)}
  if(!M.children?.length)return {};
  const id=M.children.length===1?M.children[0].id:(document.getElementById('cahierKid')?.value||M.children[0].id);
  const child=M.children.find(x=>x.id===id)||M.children[0];
  const q=await sb.from('enrollments').select('class_id,classes(name,levels(name))').eq('student_id',child.id).is('withdrawn_at',null).order('enrolled_at',{ascending:false}).limit(1).maybeSingle();
  return {classId:q.data?.class_id,child,className:q.data?.classes?.name};
 }
 return {};
}
function formatDay(d){return d?new Date(d+'T00:00:00').toLocaleDateString('fr-FR',{weekday:'long',day:'2-digit',month:'long',year:'numeric'}):''}
async function cahier(){
 const canManage=!!(M.staff||M.teacher);
 if(canManage){
  const classes=M.eclasses||[];
  V().innerHTML='<div class="bar"><h2 style="margin-right:auto">Cahier de textes</h2><button class="p" id="addLesson">+ Cours</button><button id="addHomework">+ Devoir</button></div><div class="card"><div class="two"><div class="field"><label>Classe</label><select id="bookClass">'+classes.map(x=>'<option value="'+x.id+'">'+esc(x.name)+'</option>').join('')+'</select></div><div class="field"><label>Filtre</label><select id="bookFilter"><option value="all">Tout</option><option value="lessons">Cours</option><option value="homework">Devoirs</option></select></div></div></div><div id="bookList"></div>';
  const load=async()=>{
   const cid=bookClass.value;
   const [lr,hr]=await Promise.all([
    sb.from('lessons').select('id,lesson_date,title,content,classes(name),teachers(first_name,last_name)').eq('class_id',cid).order('lesson_date',{ascending:false}).order('created_at',{ascending:false}).limit(100),
    sb.from('homework').select('id,due_date,title,description,classes(name),teachers(first_name,last_name)').eq('class_id',cid).order('due_date',{ascending:false}).limit(100)
   ]);
   if(lr.error)return toast(lr.error.message,true);if(hr.error)return toast(hr.error.message,true);
   renderCahierTimeline(lr.data||[],hr.data||[],true);
  };
  bookClass.onchange=load;bookFilter.onchange=load;
  addLesson.onclick=()=>cahierForm('lesson',bookClass.value,load);addHomework.onclick=()=>cahierForm('homework',bookClass.value,load);
  if(!classes.length){V().innerHTML='<div class="card empty">Aucune classe d’anglais disponible.</div>';return}load();
 }else{
  const info=await getLearnerClassId();
  if(!info.classId){V().innerHTML='<div class="card empty">Aucune classe active trouvée.</div>';return}
  if(M.parent&&M.children?.length>1){
   const selector='<div class="field"><label>Élève</label><select id="cahierKid">'+opts(M.children,'id',x=>x.last_name+' '+x.first_name,info.child.id)+'</select></div>';
   V().innerHTML=selector+'<div id="learnerCahier"></div>';
   cahierKid.onchange=()=>loadLearnerCahier(cahierKid.value);await loadLearnerCahier(info.child.id);
  }else{
   V().innerHTML='<div id="learnerCahier"></div>';await loadLearnerCahier(info.child.id);
  }
 }
}
async function loadLearnerCahier(childId){
 const q=await sb.from('enrollments').select('class_id,classes(name,levels(name))').eq('student_id',childId).is('withdrawn_at',null).order('enrolled_at',{ascending:false}).limit(1).maybeSingle();
 const classId=q.data?.class_id;if(!classId){document.getElementById('learnerCahier').innerHTML='<div class="card empty">Aucune classe active trouvée.</div>';return}
 const [lr,hr]=await Promise.all([
  sb.from('lessons').select('id,lesson_date,title,content,classes(name),teachers(first_name,last_name)').eq('class_id',classId).order('lesson_date',{ascending:false}).limit(100),
  sb.from('homework').select('id,due_date,title,description,classes(name),teachers(first_name,last_name)').eq('class_id',classId).order('due_date',{ascending:false}).limit(100)
 ]);
 if(lr.error)return toast(lr.error.message,true);if(hr.error)return toast(hr.error.message,true);
 renderCahierTimeline(lr.data||[],hr.data||[],false,document.getElementById('learnerCahier'));
}
function renderCahierTimeline(lessons,homeworks,manage=false,target=null){
 const filter=document.getElementById('bookFilter')?.value||'all';
 const events=[];
 if(filter!=='homework')lessons.forEach(x=>events.push({date:x.lesson_date,type:'lesson',id:x.id,title:x.title,body:x.content,teacher:x.teachers}));
 if(filter!=='lessons')homeworks.forEach(x=>events.push({date:x.due_date,type:'homework',id:x.id,title:x.title,body:x.description,teacher:x.teachers}));
 events.sort((a,b)=>String(b.date||'').localeCompare(String(a.date||'')));
 const latest=events[0];
 const html='<div class="card hero"><div style="font-size:12px;opacity:.85">CAHIER DE TEXTES · '+(latest?'DERNIÈRE ACTUALITÉ':'SUIVI DE LA CLASSE')+'</div><h2 style="margin:4px 0">'+(latest?esc(latest.title):'Aucune entrée')+'</h2><div class="mu">'+(latest?formatDay(latest.date):'')+'</div></div>'+
 '<div class="card"><div class="bar"><b>Chronologie</b><span class="tag">'+events.length+' entrée(s)</span></div>'+events.map((x,i)=>'<div class="msg '+(i===0?'unread':'')+'" style="border-left:4px solid '+(x.type==='lesson'?'var(--ac)':'var(--yl)')+'"><div class="meta">'+formatDay(x.date)+' · '+(x.type==='lesson'?'COURS':'DEVOIR')+'</div><b>'+esc(x.title)+'</b><p style="white-space:pre-wrap;margin:6px 0">'+esc(x.body||'')+'</p>'+(x.teacher?'<div class="meta">Enseignant : '+esc((x.teacher.first_name||'')+' '+(x.teacher.last_name||''))+'</div>':'')+(manage?'<div class="bar" style="margin-top:8px">'+(x.type==='lesson'?'<button data-del-lesson="'+x.id+'">Supprimer</button>':'<button data-del-homework="'+x.id+'">Supprimer</button>')+'</div>':'')+'</div>').join('')+(events.length?'':'<div class="empty">Aucun cours ou devoir enregistré.</div>')+'</div>';
 if(target)target.innerHTML=html;else V().querySelector('#bookList').innerHTML=html;
 if(manage){
  V().querySelectorAll('[data-del-lesson]').forEach(b=>b.onclick=async()=>{if(!confirm('Supprimer ce cours ?'))return;const {error}=await sb.from('lessons').delete().eq('id',b.dataset.delLesson);if(error)toast(error.message,true);else document.getElementById('bookClass')?.dispatchEvent(new Event('change'))});
  V().querySelectorAll('[data-del-homework]').forEach(b=>b.onclick=async()=>{const item=b.closest('.msg');const title=item?.querySelector('b')?.textContent?.trim()||'ce devoir';if(!confirm('Confirmer la suppression du devoir « '+title+' » ? Un code d’accès administrateur sera exigé.'))return;const adminCode=await requestAdminDeleteCode();if(!adminCode)return toast('Suppression annulée : code non saisi.',true);b.disabled=true;const {error}=await sb.rpc('delete_homework',{p_homework_id:b.dataset.delHomework,p_admin_code:adminCode});if(error){b.disabled=false;toast(error.message,true)}else{toast('Devoir supprimé.');document.getElementById('bookClass')?.dispatchEvent(new Event('change'))}});
 }
}
async function cahierForm(kind,classId,refresh){
 const title=kind==='lesson'?'Ajouter un cours':'Ajouter un devoir';
 const html=kind==='lesson'?'<div class="field"><label>Date du cours *</label><input id="cfDate" type="date" value="'+new Date().toISOString().slice(0,10)+'"></div><div class="field"><label>Titre *</label><input id="cfTitle" placeholder="Ex. Present Simple"></div><div class="field"><label>Contenu</label><textarea id="cfContent" placeholder="Résumé du cours, activités, travail réalisé..."></textarea></div>':'<div class="field"><label>Date limite *</label><input id="cfDate" type="date"></div><div class="field"><label>Titre *</label><input id="cfTitle" placeholder="Ex. Exercise on the Present Simple"></div><div class="field"><label>Consignes</label><textarea id="cfContent" placeholder="Travail à faire..."></textarea></div>';
 modal('<button class="close" onclick="closeModal()">×</button><h2>'+title+'</h2>'+html+'<div class="bar"><button onclick="closeModal()">Annuler</button><button class="p" id="cfSave">Enregistrer</button></div>');
 cfSave.onclick=async()=>{
  if(!cfDate.value||!cfTitle.value.trim())return toast('Date et titre obligatoires',true);
  const teacherId=M.teacher?.id;
  if(!teacherId)return toast('Aucun profil enseignant associé à ce compte.',true);
  let payload=kind==='lesson'?{school_id:M.me.school_id,academic_year_id:M.eclasses.find(x=>x.id===classId)?.academic_year_id,class_id:classId,subject_id:M.english.id,teacher_id:teacherId,lesson_date:cfDate.value,title:cfTitle.value.trim(),content:cfContent.value.trim()||null}:{school_id:M.me.school_id,academic_year_id:M.eclasses.find(x=>x.id===classId)?.academic_year_id,class_id:classId,subject_id:M.english.id,teacher_id:teacherId,due_date:cfDate.value,title:cfTitle.value.trim(),description:cfContent.value.trim()||null};
  const {error}=await sb.from(kind==='lesson'?'lessons':'homework').insert(payload);
  if(error)toast(error.message,true);else{closeModal();toast(kind==='lesson'?'Cours ajouté au cahier.':'Devoir ajouté au cahier.');refresh()}
 };
}
async function edt(){
 let classIds=[];
 if(M.teacher)classIds=(M.eclasses||[]).map(x=>x.id);
 else if(M.student){const e=await sb.from('enrollments').select('class_id').eq('student_id',M.student.id).is('withdrawn_at',null).limit(1).maybeSingle();if(e.data?.class_id)classIds=[e.data.class_id]}
 else if(M.parent){
  if(!M.children){const q=await sb.from('parent_student').select('student_id,students(id,first_name,last_name)').eq('parent_id',M.parent.id);M.children=(q.data||[]).map(x=>x.students).filter(Boolean)}
  if(!M.children.length){V().innerHTML='<div class="card empty">Aucun élève rattaché à ce compte.</div>';return}
  V().innerHTML='<div class="field"><label>Élève</label><select id="edtKid">'+opts(M.children,'id',x=>x.last_name+' '+x.first_name)+'</select></div><div id="edtBox"></div>';

async function loadLearnerEdt(studentId){

function renderEdt(data,target){

}
boot();
